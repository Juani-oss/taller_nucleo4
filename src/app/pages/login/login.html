<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>

                    <form (ngSubmit)="login()" #formulario="ngForm">
                        <div class="mb-3">
                            <label class="form-label" for="email">Correo</label>
                            <input class="form-control" id="email" type="email" name="email" [(ngModel)]="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input class="form-control" id="password" type="password" name="password" [(ngModel)]="password" required>
                        </div>

                        @if (error()) {
                            <div class="alert alert-danger" role="alert">{{ error() }}</div>
                        }

                        <button class="btn btn-primary w-100" type="submit" [disabled]="formulario.invalid">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
